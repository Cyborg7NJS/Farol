<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retangulo Boludo</title>
    <style>
        body{
            width: 100%;
            height: 100vh;
            background-color: bisque;
        }
        .farol{
            width: 100px;
            background: gray;
            padding: 20px;
            border-radius: 20px;
            margin: 20px auto;
        }
        .luz{
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 15px auto;
            opacity: 0.3;
        }

        .acesa{
            opacity: 1;
        }
    </style>
</head>
<body>
   <div class="farol">
    <div id="vermelho" class="luz" style="background: red;"></div>
    <div id="amarelo" class="luz" style="background: yellow;"></div>
    <div id="verde" class="luz" style="background: green;"></div>
   </div> 
   <button onclick="mudarFarol()">Mudar</button>

    <script>
        let estado = 0 // quando for 0 vai ser = a vermelho, quando for 1 = amarelo e 2 = verde

        function mudarFarol(){
            let vermelho = document.getElementById('vermelho')
            let amarelo = document.getElementById('amarelo')
            let verde = document.getElementById('verde')

            vermelho.classList.remove("acesa")
            amarelo.classList.remove("acesa")
            verde.classList.remove("acesa")

            if (estado === 0){
                vermelho.classList.add("acesa")
                estado = 1
            }else if(estado === 1){
                amarelo.classList.add("acesa")
                estado = 2
            }else{
                verde.classList.add("acesa")
                estado = 0
            }
        }
    </script>
</body>
</html>
